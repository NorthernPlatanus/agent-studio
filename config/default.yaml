# ============================================================================
# Generic skeleton defaults — PROJECT-AGNOSTIC.
# A concrete project overrides these in config/projects/<name>.yaml
# (selected via --project or ORCH_PROJECT). Personal overrides go in
# config/local.yaml (gitignored). Env vars win over everything: ORCH_<SECTION>_<KEY>.
# ============================================================================

project:
  repo_path: null            # REQUIRED per project
  base_branch: main
  feature_branch: agents/feature   # orchestrator-owned; merges into it are automatic
  backlog_file: BACKLOG.md         # human-readable source of truth
  todo_file: null                  # optional at-a-glance board
  protocol_file: null              # optional repo protocol doc (context for planner)
  # Paths (prefixes) that exist only in the primary checkout (gitignored in
  # the repo) and must be read from repo_path even when working in a worktree.
  untracked_doc_prefixes: []

paths:
  state_dir: ./state               # SQLite store + LangGraph checkpoints + logs
  work_dir: ./state/worktrees      # per-candidate git worktrees (outside the repo)

# Backlog adapter: how tasks are recognized in backlog_file and how status is
# written back. The default adapter is a markdown checklist; the regex must
# expose named groups (status, id, title).
backlog:
  adapter: markdown_checklist
  item_pattern: '^\s*-\s*\[(?P<status>[ x~!])\]\s*\*\*(?P<id>[A-Z]+-\d+)\*\*\s*(?P<title>.+)$'
  status_chars: {todo: " ", in_progress: "~", done: "x", blocked: "!"}

providers:
  claude_cli:
    type: claude_cli
    binary: claude
    allowed_tools: "Read,Grep,Glob"   # read-only: planner/reviewer inspect, never edit
    # ── Timeouts: the IDLE clock is the real one ──────────────────────────────
    # A smart-tier call is a tool loop whose length the model decides. Measured
    # on a pre-alpha test run (opus at effort=high): a healthy turn is 24 tool
    # turns / ~1.1M tokens read / 334s, and the same call has been observed past
    # 600s. So a wall-clock cap sized for the median fails intermittently no
    # matter what number you pick — which is exactly what the old `timeout_s: 600`
    # did, killing working planner turns and losing the whole session with them.
    #
    # idle_timeout_s caps SILENCE instead. The provider streams the CLI's events
    # (thinking heartbeats, tool calls, and output deltas), so no output for
    # minutes means genuinely wedged. A wedge now dies in 5 minutes rather than
    # 10, and a slow-but-working call is never killed at all. Measured gaps on
    # two real planner turns: 11s and 2s worst-case — this has ~30x headroom.
    idle_timeout_s: 300
    # Absolute ceiling — the backstop against a loop that emits forever. Loose on
    # purpose; the idle clock is the one meant to fire. null disables it.
    timeout_s: 3600
    # ── How long a reused session stays worth resuming ───────────────────────
    # `--resume` is cheap only while the conversation's prefix is still in the
    # prompt cache (TTL: one hour). Past it, resuming replays the WHOLE
    # accumulated conversation as fresh input at cache-write weight — strictly
    # worse than starting over, which at least re-sends only the payload. So a
    # session idle longer than this is abandoned and the next turn opens a new
    # one, carrying a digest of the old (see ops/handoff.py) instead of its
    # tokens. 50 minutes leaves headroom under the TTL for a turn that is itself
    # minutes long. 0 disables expiry.
    session_max_idle_s: 3000
    # Attempts per call, total (1 = no retry). Spent only on failures that say
    # nothing about the request: an idle wedge, or a transient 5xx/network exit.
    # A limit hit is never retried (it becomes LimitExhausted for the run's own
    # pause/degrade ladder), and neither is blowing timeout_s — that call was
    # working the whole time and would do it again. A retry RESUMES the killed
    # attempt's CLI session, so it keeps that exploration instead of paying for
    # it twice.
    retry_attempts: 2
    # ── Ceiling on simultaneous `claude -p` processes ────────────────────────
    # Nothing above this bounds LLM concurrency: the effective number of calls
    # in flight is run.max_parallel_tasks x len(roles.worker.candidates) — 3 x 3
    # by default — and each one here is a whole Node runtime doing tool work
    # against ONE subscription. Nine at once hits the rate limit almost
    # immediately, and a limit error is not local damage: the batch runner waits
    # with FIRST_EXCEPTION, so it cancels every sibling task with it.
    #
    # Two keeps a second candidate genuinely overlapping the first (the point of
    # best-of-N) without racing the limit. The excess queues on a semaphore held
    # by the provider instance; it is never dropped. null or 0 = unbounded.
    # `orchestrator run` warns at startup when the candidate pool is wider than
    # this, because then the pool costs best-of-3 money at best-of-2 speed.
    max_concurrency: 2
    # TIER-WIDE fallback reasoning effort: low | medium | high | xhigh | max.
    # null leaves the CLI's own default alone. Per-role keys win over this —
    # roles.planner.effort, roles.reviewer.effort, run.escalate_effort — because
    # the roles aren't equally hard (the planner's mistakes propagate into every
    # downstream attempt; the reviewer grades against criteria already written).
    # Higher effort spends more subscription tokens per call, the binding
    # constraint, so it shows up directly in `orchestrator metrics`.
    effort: null
  # Codex smart-tier alternative. Defined here (not commented) so that flipping
  # roles.smart_provider to codex_cli is a genuine one-line switch. `codex exec`
  # defaults to a read-only sandbox — planner/reviewer never edit the repo.
  codex_cli:
    type: codex_cli
    binary: codex
    allowed_tools: "read-only"      # -> --sandbox read-only (read-only|workspace-write|danger-full-access)
    auth: subscription              # subscription (logged, not counted) | api (counted vs cash budget)
    enable_mcp: false               # best-effort MCP translation; codex exec cannot approve MCP calls
                                    # without a dangerous bypass, so OFF by default (never weakens sandbox)
    mcp_bypass: false               # TEMPORARY workaround for openai/codex#24135: adds
                                    # --dangerously-bypass-approvals-and-sandbox (and drops --sandbox) so
                                    # codex exec can run MCP tools non-interactively. Requires enable_mcp too.
                                    # Removes the sandbox — enable ONLY inside a disposable worktree/container.
    idle_timeout_s: 300             # see claude_cli above — silence, not wall clock
    timeout_s: 3600                 # absolute backstop; null disables
    max_concurrency: 2              # see claude_cli above — one runtime per call, one subscription
  # ── Metered HTTP tiers ────────────────────────────────────────────────────
  # These spend CASH, not subscription quota, so every call lands in the ledger's
  # cash channel and counts against budget.per_task_usd / per_run_usd. Defined
  # here so the presets below are complete bindings out of the box; a provider
  # nothing points at is inert — no client is constructed and no key is read.
  # A missing API key on a provider a role or worker actually uses is a STARTUP
  # ERROR (core/validate.py), not a 401 discovered on task 7.
  openai:
    type: openai_responses          # provider type lands with the Responses client
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    timeout_s: 300
  anthropic:
    type: anthropic_api             # provider type lands with the Messages client
    api_key_env: ANTHROPIC_API_KEY
    timeout_s: 300
  # CometAPI: one OpenAI-compatible endpoint fronting DeepSeek/GLM/Kimi/etc.
  # Here rather than only in a project profile because the deepseek_flash preset
  # below names it, and a preset whose provider is undefined is a binding that
  # cannot bind.
  cometapi:
    type: openai_compatible
    base_url: https://api.cometapi.com/v1
    api_key_env: COMETAPI_KEY
    timeout_s: 300

# ============================================================================
# PRESETS — named, complete backend bindings.
# ============================================================================
# A preset answers one question in one place: "what does it mean to run on this
# backend?" — which provider, which model id, what reasoning effort, and what it
# costs. `worker_models.<key>` and `roles.<role>` point at one with
# `preset: <name>`; the preset fills in provider/model/effort/prices and any key
# written explicitly on the entry still wins. An entry with no `preset:` behaves
# exactly as it always did.
#
# WHY a layer instead of repeating five keys per entry: moving a worker between
# a metered API and a CLI riding an existing subscription is the change the cost
# question actually turns on, and it should be a one-line edit that no code
# knows about. It is also the list the Studio UI binds against — the panel picks
# a preset, it never defines one, so nothing a browser sends can become a
# base_url, an argv, an API key or a price.
#
# Project profiles may add or override presets (this section deep-merges like
# every other). Env overrides cannot reach in here: ORCH_<SECTION>_<KEY> is one
# level deep by design.
presets:
  # ── GPT-5.6 Luna (metered) ──────────────────────────────────────────────
  # Three efforts, one model. Diversify a best-of-N pool by EFFORT and by the
  # per-worker `approach` hint — never by temperature: reasoning models reject
  # `temperature`, the tolerant-400 retry strips it, and three "diverse"
  # candidates collapse into three identical calls at 3x the price. Config
  # validation warns when a pool collapses that way.
  luna_high:
    label: "GPT-5.6 Luna · high"
    provider: openai              # key into providers: above
    model: gpt-5.6-luna
    effort: high                  # none | low | medium | high | xhigh | max
    input_per_mtok: 0.20
    output_per_mtok: 1.20
    # Cache tiers: a cached input token is 10x cheaper than a fresh one. Absent,
    # both hit and miss fall back to input_per_mtok — i.e. the flat pricing every
    # entry had before, so nothing regresses for a model with no cache rates.
    #
    # NO cache_write_per_mtok here, on purpose. `cache_miss` in this codebase is
    # "input tokens not served from cache" (openai_compatible._cache_tokens
    # derives it as in_tok - hit), which is NOT the same set as "tokens written
    # to the cache" — it also covers the volatile suffix that never gets cached
    # at all. Pricing all of it at a write premium would inflate every cold call
    # by 25%, and input dominates this workload, so the ledger's cash column
    # would read high across the board. A write rate belongs here only once a
    # provider reports a distinct cache-creation count (the Anthropic shape) and
    # LLMResult carries it as its own channel.
    cache_read_per_mtok: 0.02
    # THE LONG-CONTEXT CLIFF. Above the threshold the provider re-prices the
    # ENTIRE request — not the overflow — so a 300K-token call costs 2x input and
    # 1.5x output on every token in it, including the first. Modelled explicitly
    # because the alternative is a ledger that understates a big call by ~2x and
    # a pre-flight budget guard that waves through calls it should have refused.
    long_context: {threshold_in_tok: 272000, input_multiplier: 2.0, output_multiplier: 1.5}
  luna_med:
    label: "GPT-5.6 Luna · medium"
    provider: openai
    model: gpt-5.6-luna
    effort: medium
    input_per_mtok: 0.20
    output_per_mtok: 1.20
    cache_read_per_mtok: 0.02
    long_context: {threshold_in_tok: 272000, input_multiplier: 2.0, output_multiplier: 1.5}
  luna_xhigh:
    label: "GPT-5.6 Luna · xhigh"
    provider: openai
    model: gpt-5.6-luna
    effort: xhigh
    input_per_mtok: 0.20
    output_per_mtok: 1.20
    cache_read_per_mtok: 0.02
    long_context: {threshold_in_tok: 272000, input_multiplier: 2.0, output_multiplier: 1.5}
  # ── Subscription CLIs ───────────────────────────────────────────────────
  # No prices, deliberately: these ride an existing subscription, so their calls
  # are logged in the ledger's SUBSCRIPTION channel at $0 cash and are never
  # summed with the cash column. The flip side is that they have no cash ceiling
  # at all — budget.per_task_usd cannot bound a tier that spends no cash, and
  # only the run's idle/total clocks do.
  claude_cli_sonnet: {label: "Claude Code CLI · sonnet", provider: claude_cli, model: sonnet, effort: medium}
  claude_cli_opus:   {label: "Claude Code CLI · opus",   provider: claude_cli, model: opus,   effort: high}
  codex_cli_default: {label: "Codex CLI", provider: codex_cli, model: gpt-5.6-terra}
  # ── Demoted, not deleted ────────────────────────────────────────────────
  # DeepSeek V4 Flash was the whole worker tier until its price moved. It stays
  # selectable so the comparison is one config line, not a code change.
  deepseek_flash:    {label: "DeepSeek V4 Flash (CometAPI)", provider: cometapi, model: deepseek-v4-flash,
                      input_per_mtok: 0.12, output_per_mtok: 0.24}

# per project: name -> {provider, model, input_per_mtok, output_per_mtok}, or
# `{preset: <name>}` plus whatever that preset should not decide for this entry
# (`params`, `approach`, an overriding `effort`).
worker_models: {}

roles:
  # smart_provider drives BOTH planner and reviewer (the whole "thinking tier").
  # Flip claude_cli <-> codex_cli to A/B the smart tier; cheap workers unaffected.
  smart_provider: claude_cli        # claude_cli | codex_cli
  # provider: null => inherit smart_provider. An explicit provider still wins
  # (back-compat with profiles that hard-code provider: claude_cli).
  # `effort` (low|medium|high|xhigh|max) is per-role and overrides the tier-wide
  # providers.<name>.effort. Only reasoning-capable providers use it; codex_cli
  # and openai_compatible ignore it.
  # A role may name a `preset:` instead of provider/model/effort — e.g.
  # `planner: {preset: claude_cli_opus}`. Keys written here still win over the
  # preset, and `null` means "unset", not "override with nothing", so the
  # `provider: null` below keeps inheriting rather than blanking a preset.
  planner:  {provider: null, model: opus, effort: null}
  reviewer: {provider: null, model: opus, effort: null}
  # The visual verifier (see `verify:` below). `allowed_tools` is per-role on
  # purpose: this is the ONLY role that gets the inspector's MCP tools, and the
  # provider-wide allowlist cannot express "one role only". Tool names follow
  # mcp__<mcp_server>__<tool>; keep Read/Grep/Glob so it can also read the code.
  #
  # ►► LIST READ-ONLY INSPECTOR TOOLS ONLY. ◄◄
  # The reference inspector ships 60 tools, 24 of which mutate or execute:
  # every `set_*`, `add_helper`/`remove_helper`, `toggle_*`, `highlight_object`,
  # `click_inspect`, `overlay_selected`, `dispose_check`, `set_dev_port/url`, and
  # `run_js` (arbitrary JavaScript in the page). A verifier holding those could
  # change the live scene until it matched the acceptance criteria and then pass
  # it — verifying its own edit instead of the candidate's code, which is exactly
  # the failure this phase exists to prevent. `run_js` additionally makes the
  # allowlist meaningless, since anything excluded can be done through it.
  verifier:
    provider: null
    model: opus
    effort: null
    allowed_tools: null
  worker:
    default: null                  # REQUIRED per project (key into worker_models)
    candidates: []                 # pool for best-of-N

run:
  n_candidates: 1        # best-of-N diversity knob (the planner may raise it per task)
  # max_retries and max_fix_rounds INTERACT: with escalate_on_exhaustion on,
  # max_fix_rounds is the attempt ceiling for every retry path (gate failure and
  # review `revise` alike) and max_retries is ignored; with it off, max_retries
  # is the ceiling. See engine/graph.retry_ceiling — one function, both routers.
  max_retries: 3         # gate/review failure -> worker retry, at most this many
  max_parallel_tasks: 3  # scheduler batch width (files_write-disjoint tasks only)
  # Warm review->fix depth on the cheap Rung-1 worker before escalation. Distinct
  # from max_retries (the diversity/best-of-N ceiling): max_fix_rounds is the
  # cost-efficient refinement ceiling per candidate on a warm cache.
  max_fix_rounds: 4
  # Escalation ladder (Rung 3): when the cheap warm loop exhausts max_fix_rounds
  # without landing the task, hand it to a $0-cash SUBSCRIPTION senior (never a
  # mid-tier/senior API model). Off by default (needs a smart tier configured).
  # "Without landing it" covers BOTH shapes of stuck: no green gate, and a green
  # gate the reviewer keeps sending back with `revise` (the second used to be
  # unreachable, so a task could exhaust the ladder with the senior never called).
  escalate_on_exhaustion: false
  escalate_target: smart_provider   # the claude_cli/codex_cli subscription tier
  escalate_model: opus              # senior id — MUST co-vary with smart_provider
                                    # (opus/sonnet under claude_cli; a gpt-5.6-* id under codex_cli)
  escalate_effort: null             # senior's reasoning effort; falls back to
                                    # providers.<smart_provider>.effort when null
  # Retries the escalated senior gets after its own first attempt fails, each fed
  # the gate log through the ordinary retry branch. The senior used to get exactly
  # one shot — observed dying on a trivial missing import, i.e. the most expensive
  # tier getting the fewest chances at the task the cheap tier already failed.
  # 0 restores the old one-shot behavior.
  senior_fix_rounds: 1
  # Attempts in which EVERY candidate returned no <file>/<edit> blocks at all
  # (prose, a question, a summary) are refunded rather than charged against the
  # retry ceiling — nothing was attempted. Observed: two consecutive prose replies
  # to a review `revise` burned two of four fix rounds and forced an escalation.
  # Bounded, because a model that ALWAYS replies conversationally would otherwise
  # retry forever; 0 disables the refund.
  max_unproductive_attempts: 2
  # Routing on the planner's own `risk` / `complexity` labels. Both OFF by
  # default: they trade verification (or cheap-tier attempts) for subscription
  # quota, and which side of that trade you want is a project decision.
  #
  # Skip the reviewer entirely for a green, low-risk, single-candidate task and
  # merge it straight away — saves one smart-tier call on the majority of tasks.
  # Never applies to `visual: true` specs, and the merge is logged as
  # `auto_integrated` so "merged without review" is visible in the ledger.
  auto_integrate_low_risk: false
  # Send `risk: high` / `complexity: l` specs to the subscription senior on
  # attempt 1 instead of spending max_fix_rounds cheap attempts (and a gate run
  # each) first. Requires escalate_on_exhaustion (the senior is its target); the
  # task still gets the normal retry ladder, it just starts at the top of it.
  senior_first_for_high_risk: false
  need_files_rounds: 2   # legacy alias for retrieval_rounds (kept for back-compat)
  need_files_max_bytes: 65536
  # Bounded read-only retrieval loop (Phase 2): a worker may emit <grep>/<read>/
  # <ls> instead of a patch; the orchestrator runs them read-only in the worktree
  # and appends results to the next prompt. Keeps the planner's files_read as the
  # primary context path — retrieval supplements, never replaces it.
  retrieval_rounds: 3         # max read-only request rounds before a forced implement attempt
  retrieval_max_matches: 40   # cap on grep matches returned per request
  retrieval_snippet_lines: 4  # snippet size per grep match
  on_limit_exhausted: pause   # pause (checkpoint & stop) | degrade (opus roles -> degrade_model)
  degrade_model: null
  # Reuse ONE Claude CLI conversation across the turns of a single `discuss` loop
  # (--session-id then --resume) instead of re-sending backlog + project map +
  # every current spec on every turn. Scoped per discuss run and closed when the
  # loop ends, so the planner never inherits an unrelated run's context. A failed
  # resume falls back to the full payload automatically (SessionLost).
  # ON: measured, the payload it stops re-sending is ~47k tokens, and because the
  # agentic loop re-sends its prefix on every step that turned into 326k input
  # tokens for a single operator message. A resumed turn sends the human's answer
  # and nothing else.
  # A session that has gone cold is NOT resumed (providers.claude_cli
  # .session_max_idle_s) and a failed resume falls back to the full payload
  # automatically (SessionLost) — both paths are self-healing, which is what
  # makes this safe to default on.
  # Providers without server-side sessions (codex_cli, openai_compatible) ignore it.
  session_reuse: true
  # How long the PLANNER CHAT may sit frozen waiting for an exhausted usage
  # window to reset, before it gives up and hands the decision back.
  #
  # A planning session routinely outlasts the window it is spending: one measured
  # turn cost ~520k subscription tokens, so a real conversation can exhaust a
  # five-hour quota mid-plan. Failing there discards a conversation whose only
  # problem is the clock. The Claude CLI streams the exact reset time
  # (`rate_limit_event.resetsAt`), so the wait is a known number, never a poll —
  # and the freeze is interruptible, so an operator who does not want to wait
  # closes it. 0 disables freezing: a limit becomes an ordinary failed turn.
  # A limit with no reported reset time is never waited on, whatever this says.
  limit_freeze_max_s: 21600         # 6h — clears a five-hour window with slack

# The deterministic self-check gate: shell commands run in the candidate
# worktree, zero tokens. Entirely project-defined.
gate:
  install_cmd: null      # run once per fresh worktree, e.g. "npm ci"
  install_marker: null   # skip install_cmd if this path exists, e.g. "node_modules"
  commands: []           # REQUIRED per project
  timeout_s: 1200
  log_tail_chars: 6000   # failure log tail shown to the worker on retry

# Deterministic asset operations (ops/assetops.py). NAMED, HUMAN-AUTHORED, FIXED
# commands — the same trust level as gate.commands, never an LLM-generated string.
#
# They exist because some tasks need a real external binary-processing tool run
# against a file no LLM role can touch (decimate a .glb, transcode a texture,
# bake an atlas): the worker is patch-only with no shell BY DESIGN, and the
# planner/reviewer tier is Read/Grep/Glob. Rather than hand either of them shell,
# you write the command here and a spec references it BY NAME (`asset_op: <key>`).
# The name is the only part an LLM ever authors, and an unknown name fails the
# candidate loudly (plan-time validation rejects it earlier still).
#
# The command runs once per attempt, in the candidate's own worktree, after the
# worker's patch is committed and before the gate. Its outputs are committed, so
# they are part of the candidate's diff for review and merge. A non-zero exit or
# a timeout fails the candidate exactly like a red gate.
#
# An entry is a bare command string, or {cmd, timeout_s} when the tool is not on
# the gate's timescale (timeout_s defaults to gate.timeout_s):
#   asset_ops:
#     reduce_model_poly: "npx @gltf-transform/cli simplify in.glb out.glb --ratio 0.3"
#     bake_lightmaps: {cmd: "blender --background --python bake.py", timeout_s: 3600}
#
# Empty by default: with no entries and no spec naming one, this is a no-op.
asset_ops: {}

review:
  # The reviewer prompts demand a scorecard, so a missing one is a malformed
  # verdict, not an implicit "no objection": an `approve` with no `scores` is
  # demoted to `revise` and sent back. Set false ONLY for a reviewer model that
  # genuinely cannot emit the rubric — it re-opens the auto-approve hole the
  # rubric was added to close, and it is degrade mode (cheap reviewer, least
  # likely to score well-formed) where that hole would fire most.
  require_rubric: true

budget:
  per_task_usd: 1.50
  per_run_usd: 15.00
  # Output tokens assumed by the PRE-FLIGHT estimate when a candidate sets no
  # max_tokens. Caps are checked before a call as well as after it, so one large
  # call can't overshoot by an unbounded amount; the estimate is intentionally
  # conservative, so this is an upper bound, not a typical response size.
  assumed_max_output_tokens: 8000
  # Subscription-auth CLI tiers (claude_cli, codex_cli auth:subscription) are
  # logged for visibility but not counted against the cash budget. Set count_cli
  # true to count ALL CLI providers, or per-provider `count: true` in providers.*.
  count_claude_cli: false   # back-compat alias; counts claude_cli when true
  count_cli: false          # generalized: counts every subscription CLI provider when true

worker_output:
  full_file_max_lines: 400  # larger files must be edited via SEARCH/REPLACE
  # NOTE: there is no `mode:` key. The worker loop is always the plain-text
  # <grep>/<read>/<file>/<edit> block protocol over complete_chat, which works on
  # any chat-completions model and keeps the provider/budget layer intact. A
  # native ReAct tool-calling worker is deferred (PLAN_REVIEW.md P25-2: it
  # bypasses the budget ledger); a toggle that silently does nothing is worse
  # than no toggle, so the key is gone rather than documented-but-dead.

prompts:
  # Two-layer resolver: a per-project overlay wins over the shared templates.
  shared_dir: config/prompts               # committed templates (planner.md, worker_system.md, ...)
  project_dir: projects/{project}/prompts  # gitignored per-project overrides ({project} substituted at load)
  # Legacy `dir:` is still honored as an alias for shared_dir (back-compat).

# Structural project-map for the planner (Phase 4). Regenerated by the
# integrator after each successful merge, into the gitignored projects/<name>/
# overlay. The structural layer is free/deterministic; the prose digest is
# optional and off by default.
projectmap:
  enabled: true
  path: projectmap.md      # under projects/<name>/
  symbols: default         # 'default' regex set (or provide your own later)
  digest: false            # optional cheap prose summary; regenerated only on structural change

# Domains ("departments"): a specialization + observability layer over the
# scheduler's files_write-disjoint safety invariant (which is unchanged). A spec's
# `domain` (planner-assigned) can override the worker pool and inject a
# domain-specific protocol excerpt. Use cheap-tier worker_models keys here — NOT
# the mid-tier API models the escalation ladder deliberately skips. Illustrative;
# real domains live in the project profile.
domains: {}
  # physics: { worker_default: ds_v4_flash, protocol: physics }   # protocol -> prompts/physics.md
  # render:  { worker_default: ds_v4_flash, protocol: render }
  # seam:    {}   # cross-cutting/shared-file work; planner gives it explicit deps so it serializes

# Optional visual/runtime gate (Phase 6). Green gate => "it runs", not "it's
# correct": a three.js scene can compile clean and render nothing. This asserts
# over scene facts printed by a headless dump script. OFF by default — the
# harness runs fine with enabled:false; only `visual: true` specs are checked.
# With enabled:true but no facts_cmd, the gate passes through and logs
# `visual_gate_skipped` (never a silent green).
# Visual VERDICT (distinct from visual_gate below). The gate checks assertions you
# wrote; this asks an agent with a live scene inspector "is anything wrong here
# that nobody thought to assert?" — the question a rendering change actually turns
# on. Runs ONCE per task, on the winning candidate, after an approving review and
# before integrate, and only for `visual: true` specs.
#
# It is SERIALIZED (RunContext.inspector_lock): the dev server and inspector
# bridge are bound to fixed ports, so two concurrent verifications would inspect
# each other's app. Everything before this phase stays parallel.
#
# COST: the reference inspector exposes ~60 tools whose schemas are re-sent every
# turn — a measured trivial two-tool query cost ~77k input tokens vs ~13k for a
# plain call. Once per task, not per attempt, is what makes it affordable. Off by
# default for that reason. MEASURED on a real task: 387k-410k input tokens per
# scene verdict, not the ~158k an earlier note claimed.
#
# STRUCTURAL LIMIT, and the reason the verifier prompt has an `unverifiable` field:
# the agent attaches to an app that is ALREADY RUNNING and its read-only toolset
# (deliberately — see roles.verifier) cannot reload or remount it. So no criterion
# about the first rendered frame, a startup transient, a transition or a one-shot
# event can ever be observed here, however many times the task is retried. Such a
# verdict now ends the task as `needs_human` instead of retrying at ~400k tokens a
# go; the planner prompt tells the planner not to mark those specs `visual: true`
# in the first place. Lifting the limit properly means either granting a
# reload-only capability (navigate/reload, NOT run_js — the "cannot edit the scene
# into passing" invariant must hold) or having the gate capture the startup frame
# sequence itself and hand it over. Neither is implemented.
verify:
  enabled: false
  # Command that starts the candidate's app IN ITS OWN WORKTREE. `{port}` is
  # substituted with dev_port. Spawned in its own process group and the whole
  # group is killed on teardown, so the port is genuinely released.
  run_cmd: null            # e.g. "npm run dev -- --port {port} --strictPort"
  ready_probe: null        # e.g. "http://localhost:{port}/" — polled until it answers
  ready_timeout_s: 60
  dev_port: 5199           # app port; also handed to the inspector as DEV_PORT
  bridge_port: 9333        # inspector bridge; it falls back to a free port if taken
  headless: true           # launches its own browser — no human, no open tab needed
  # The MCP server is spawned by the CLI from a config this harness GENERATES per
  # call (the dev port is a runtime fact, so it can't be hand-maintained).
  mcp_server: threejs      # name; tools are exposed as mcp__<this>__<tool>
  mcp_command: npx
  mcp_args: ["-y", "threejs-devtools-mcp"]
  mcp_env: {}              # extra env for the server (merged over the defaults)

visual_gate:
  enabled: false
  run_cmd: null                # e.g. "npm run dev" — foreground; supervised + process-group-killed
  ready_probe: null            # e.g. "http://localhost:5173" — polled until the app
                               # started by run_cmd answers. Ignored without run_cmd
                               # (there would be nothing to wait for).
  ready_timeout_s: 60
  # THE fact source: a command run in the candidate worktree that prints a JSON
  # object of scene facts on stdout and exits 0. Examples:
  #   node scripts/dump_scene.mjs               (three.js / R3F headless walk)
  #   blender --background --python dump.py     (Blender)
  # A non-zero exit, non-JSON output, or a timeout FAILS the candidate.
  facts_cmd: null
  facts_timeout_s: 120
  assertions: []               # restricted expressions over scene facts, e.g.
                               #   - "scene.visibleMeshCount > 0"
                               #   - "any(l.intensity > 0 for l in lights)"
                               #   - "camera.seesSceneBounds"

# Extra MCP servers for claude_cli roles (reviewer/planner), e.g. a live
# devtools/inspector bridge for whatever app you're orchestrating.
# {name: {enabled, mcp_config}}
mcp: {}
