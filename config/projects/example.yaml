# ============================================================================
# TEMPLATE project profile — copy this file to projects/<yourname>/profile.yaml
# (the gitignored per-project tree) and fill in the fields below for the repo
# you want the orchestrator to work
# on. Everything here is a placeholder; nothing in this file should be treated
# as a real value. Machine-specific values (absolute paths) belong in
# config/local.yaml (gitignored, see config/local.yaml.example) instead of
# being hardcoded here, so this file stays safe to commit and share.
# ============================================================================

project:
  # REQUIRED. Prefer leaving this null here and setting the real absolute path
  # in config/local.yaml — keeps personal paths out of git entirely.
  repo_path: null
  base_branch: main
  feature_branch: agents/feature
  backlog_file: BACKLOG.md          # human-readable source of truth
  todo_file: null                   # optional at-a-glance board
  protocol_file: null               # optional repo protocol doc (context for planner)
  untracked_doc_prefixes: []        # gitignored-in-target-repo paths the planner may still need to read

paths:
  state_dir: ./state
  work_dir: null                    # REQUIRED; also fine to set via config/local.yaml

providers:
  # CometAPI: one OpenAI-compatible endpoint for DeepSeek/GLM/Kimi/etc.
  cometapi:
    type: openai_compatible
    base_url: https://api.cometapi.com/v1
    api_key_env: COMETAPI_KEY
    timeout_s: 300

# Best-of-N brainstorm: three candidates on ONE model, differentiated by a static
# `approach` hint appended to the worker's stable prefix. Same model, three
# framings — good for comparing how the model responds while the free gate culls
# the losers.
#
# `preset:` (see the `presets:` block in config/default.yaml) supplies provider,
# model, effort and the whole price shape. Do NOT restate any of those here: an
# inline `provider:`/`model:`/`*_per_mtok` WINS over the preset, which is how a
# rebind silently does nothing. Keys the preset does not own — `approach`,
# `params`, a role's `allowed_tools` — stay on the entry.
#
# NO `params: {temperature: ...}`. This tier used to differentiate that way; a
# reasoning model rejects `temperature`, the tolerant-400 retry strips it, and
# best-of-3 collapses into one call billed three times. `approach` is the axis
# that survives, and it costs nothing extra because it lands AFTER the cached
# prefix — all three candidates share one cached prompt.
#
# To run the cheap OpenAI-compatible tier instead, swap the preset for
# `deepseek_flash` (still shipped); for a subscription CLI, `claude_cli_sonnet`.
# NOTE: `approach` is static config for now; a future version may let the planner
# assign it per-task (see the gitignored devdocs/FUTURE_NOTES.md).
worker_models:
  flash_lo:  {preset: luna_high,
              approach: "Simplest correct solution. Minimal diff, no refactoring beyond the task, no cleverness."}
  flash_mid: {preset: luna_high,
              approach: "Balanced: correct, readable, idiomatic to the surrounding code."}
  flash_hi:  {preset: luna_high,
              approach: "Thorough: handle edge cases, invalid input, and error paths explicitly."}

roles:
  # smart_provider drives BOTH planner and reviewer (the whole "thinking tier").
  # Flip it to codex_cli to A/B Claude vs Codex in one line; leave the per-role
  # provider null so it inherits (an explicit provider would pin the role and
  # defeat the switch — see README "The economic model").
  smart_provider: claude_cli        # claude_cli | codex_cli
  planner:  {provider: null, model: opus}
  reviewer: {provider: null, model: opus}
  worker:
    default: flash_mid              # used when n_candidates == 1
    candidates: [flash_lo, flash_mid, flash_hi]   # best-of-N pool (order-independent)

run:
  n_candidates: 3                   # best-of-3 across the three Flash behaviors
  on_limit_exhausted: pause
  degrade_model: flash_lo           # if the smart tier hits its limit, reroute it here

gate:
  install_cmd: null       # e.g. "npm ci", "pip install -e .[dev]", "cargo fetch"
  install_marker: null    # skip install_cmd if this path exists, e.g. "node_modules"
  commands: []            # REQUIRED, e.g. ["npm run typecheck", "npm run lint", "npm test"]
  timeout_s: 1200

# Named, human-authored commands for work no LLM role can do (workers have no
# shell by design; the planner is read-only). A spec references one BY NAME —
# `asset_op: reduce_hero_mesh` — and it runs in the candidate worktree before the
# gate, with its outputs committed into the candidate's diff. Same trust level as
# gate.commands. Empty = feature off. Value is a command string, or
# {cmd, timeout_s} when the tool needs longer than gate.timeout_s.
asset_ops: {}
  # reduce_hero_mesh: "npx gltf-transform simplify public/hero.glb public/hero.low.glb --ratio 0.3"
  # bake_lightmaps: {cmd: "blender --background --python tools/bake.py", timeout_s: 3600}

# Optional extra MCP servers for the planner/reviewer roles (claude_cli), e.g.
# a live app inspector or devtools bridge specific to your project. Off by
# default. {name: {enabled, mcp_config}}
mcp: {}
