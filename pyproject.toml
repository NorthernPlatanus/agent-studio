[project]
name = "agent-studio"
version = "0.1.0"
description = "Project-agnostic LangGraph multi-agent development orchestrator — plug in any repo with a gate + backlog protocol"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "openai>=1.60.0",
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
studio = ["langgraph-cli[inmem]>=0.2"]  # graph UI; requires Python 3.11+

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orchestrator*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
